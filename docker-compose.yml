services:
  # Aplicação Laravel (PHP 8.3-FPM)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: devfolio-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - devfolio

  # Servidor web
  nginx:
    image: nginx:1.27-alpine
    container_name: devfolio-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - devfolio

  # Banco de dados MySQL 8.4
  mysql:
    image: mysql:8.4
    container_name: devfolio-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-33060}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-devfolio}
      MYSQL_USER: ${DB_USERNAME:-devfolio}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devfolio

  # Node 20 para build de assets (Vite). Uso sob demanda:
  #   docker compose run --rm node npm install
  #   docker compose run --rm node npm run dev
  node:
    image: node:20-alpine
    container_name: devfolio-node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - devfolio
    profiles:
      - tools

networks:
  devfolio:
    driver: bridge

volumes:
  mysql-data:
    driver: local
